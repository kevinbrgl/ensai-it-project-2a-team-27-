[project]
name = "ex_libris_frontend"
version = "0.1.0"
description = "Ex-Libris Web Frontend — Literary tracking inspired by Letterboxd"
authors = [{ name = "Team 27" }]
requires-python = ">=3.13"

dependencies = ["pandas", "python-dotenv", "PyYAML", "requests", "streamlit"]

[project.optional-dependencies]
dev = ["bandit", "coverage", "pylint", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["*test*.py"]
addopts = "-v -s"
