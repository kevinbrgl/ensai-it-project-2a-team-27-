name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL database, created for each run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # Read by src/core/config.py in place of a .env file
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DATABASE: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Static checks fail on the first broken rule, before the tests run.
      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (mypy)
        run: uv run mypy src tests frontend/app.py

      - name: Unit tests
        run: uv run pytest tests/unit -v

      # Also reruns the unit tests (about 3 s) to measure total coverage.
      - name: Integration tests and coverage
        run: uv run pytest --cov=src --cov-report=term