name: pipeline

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-backend-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync backend dependencies
        run: uv sync --all-extras

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U test_user -d test_db; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run backend tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DATABASE: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_SCHEMA: project
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          uv run coverage run -m pytest
          uv run coverage report

      - name: Lint backend with Ruff
        run: uv run ruff check src tests --exit-zero

      - name: Security scan backend
        run: uvx bandit -r src --severity-level high

  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-frontend-${{ runner.os }}-${{ hashFiles('frontend/uv.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync frontend dependencies
        run: uv sync --project frontend --all-extras

      - name: Lint frontend with Ruff
        run: uv run --project frontend ruff check frontend/src

      - name: Security scan frontend
        run: uv run --project frontend bandit -r frontend/src
