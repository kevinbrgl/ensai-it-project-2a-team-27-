[project]
name = "ex-libris"
version = "1.0.0"
description = "Ex-Libris: reading tracker REST API (FastAPI + PostgreSQL) and its web frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "psycopg2>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.35.0",
    "bcrypt==4.3.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.3.0",
    "httpx2>=2.13.1",
]


[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview=true
select=[
    "ALL"
]
ignore=[
    "implicit-namespace-package",
    "CPY",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "docstring-missing-yields",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line"
]

[tool.ruff.lint.per-file-ignores]
"src/api/routes/**" = [
    "escape-sequence-in-docstring",
    "ambiguous-unicode-character-string",
]
"src/models/__init__.py" = ["unused-import"]
"tests/**" = [
    "assert",
    "no-self-use",
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
]

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "mypy>=1.17.1",
    "types-psycopg2>=2.9.21.20250809",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.1.0",
]
